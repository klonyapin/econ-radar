# Scheduled policy events. Used to (a) inject context into LLM prompts around
# meeting times, and (b) post morning briefings for the next 48h.
#
# Times are UTC. When the entity is Fed/BOE, DST shifts the announcement time
# by 1h — use the summer time for late-Mar to late-Oct.
#
# You MUST update this yaml once a year with the next year's schedule (or
# whenever a central bank publishes an updated calendar).
# Reference schedules:
#   FOMC: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#   BOJ:  https://www.boj.or.jp/en/mopo/mpmsche_minu/index.htm
#   ECB:  https://www.ecb.europa.eu/press/calendars/mgcgc/html/index.en.html
#   BOE:  https://www.bankofengland.co.uk/monetary-policy/monetary-policy-summary-and-minutes

events:
