# Data sources for econ-radar Phase 1.
# Each source's polling cadence is driven by the corresponding GitHub Actions
# workflow (frequent = */15min, daily, weekly).
#
# NOTE: RSS URLs shift over time. If a source stops fetching, first verify
# the feed URL is still live.

sources:
  # ─────────── News RSS (frequent) ───────────
  - id: reuters_business
    type: rss
    url: https://feeds.reuters.com/reuters/businessNews
    category: news
    frequency: frequent
  - id: reuters_worldnews
    type: rss
    url: https://feeds.reuters.com/Reuters/worldNews
    category: news
    frequency: frequent
  - id: bbc_business
    type: rss
    url: https://feeds.bbci.co.uk/news/business/rss.xml
    category: news
    frequency: frequent
  - id: nikkei_top
    type: rss
    url: https://www.nikkei.com/rss/
    category: news
    frequency: frequent
  - id: ft_world
    type: rss
    url: https://www.ft.com/world?format=rss
    category: news
    frequency: frequent

  # ─────────── Central bank feeds (frequent) ───────────
  # NOTE: PBOC / SNB / RBA / BOC don't publish stable public RSS or bot-block
  # generic clients. Their content is still picked up via Reuters and GDELT.
  - id: fed_press
    type: rss
    url: https://www.federalreserve.gov/feeds/press_all.xml
    category: central_bank
    frequency: frequent
  - id: fed_monetary
    type: rss
    url: https://www.federalreserve.gov/feeds/press_monetary.xml
    category: central_bank
    frequency: frequent
  - id: ecb_press
    type: rss
    url: https://www.ecb.europa.eu/rss/press.xml
    category: central_bank
    frequency: frequent
  - id: boj_press
    type: rss
    url: https://www.boj.or.jp/rss/whatsnew.xml
    category: central_bank
    frequency: frequent
  - id: boe_news
    type: rss
    url: https://www.bankofengland.co.uk/rss/news
    category: central_bank
    frequency: frequent
  - id: boe_publications
    type: rss
    url: https://www.bankofengland.co.uk/rss/publications
    category: central_bank
    frequency: frequent
  - id: rbi_press
    type: rss
    url: https://www.rbi.org.in/pressreleases_rss.xml
    category: central_bank
    frequency: frequent

  # ─────────── Institutional investors (frequent) ───────────
  # GPIF (Japan's public pension fund, ~$1.7T AUM) — quarterly reports
  # move markets, and any policy change signals major flow shifts.
  # 生命保険協会 (Seiho) の RSS も見たが地域チャプター報告ばかりで
  # 投資情報が薄いため見送り。
  - id: gpif_press_ja
    type: rss
    url: https://www.gpif.go.jp/rss.xml
    category: institutional_investor
    frequency: frequent
  - id: gpif_press_en
    type: rss
    url: https://www.gpif.go.jp/en/rss.xml
    category: institutional_investor
    frequency: frequent

  # ─────────── Government policy feeds (frequent) ───────────
  - id: kantei_press
    type: rss
    url: https://www.kantei.go.jp/index.rss
    category: policy
    frequency: frequent
  - id: whitehouse_briefings
    type: rss
    url: https://www.whitehouse.gov/briefing-room/feed/
    category: policy
    frequency: frequent
  - id: mof_japan
    type: rss
    url: https://www.mof.go.jp/rss/press_release.xml
    category: policy
    frequency: frequent

  # ─────────── Reddit retail sentiment (frequent) ───────────
  # Reddit の JSON API は 2023 以降 OAuth 必須で 403 になるが、RSS は無認証で
  # そのまま取れる。/hot/.rss は engagement 順に上位 25 件を返すので、追加
  # フィルタなしでも高シグナルポストが取れる。LLM 政策検知は発火させない
  # (retail_sentiment カテゴリは policy_classifier の対象外)。
  - id: reddit_wsb
    type: rss
    url: https://www.reddit.com/r/wallstreetbets/hot/.rss
    category: retail_sentiment
    frequency: frequent
  - id: reddit_investing
    type: rss
    url: https://www.reddit.com/r/investing/hot/.rss
    category: retail_sentiment
    frequency: frequent
  - id: reddit_stocks
    type: rss
    url: https://www.reddit.com/r/stocks/hot/.rss
    category: retail_sentiment
    frequency: frequent
  - id: reddit_economics
    type: rss
    url: https://www.reddit.com/r/Economics/hot/.rss
    category: retail_sentiment
    frequency: frequent
  - id: reddit_crypto
    type: rss
    url: https://www.reddit.com/r/CryptoCurrency/hot/.rss
    category: retail_sentiment
    frequency: frequent

  # ─────────── Wikipedia edit history (frequent, leading indicator) ───────────
  # Burst of substantive edits to a policy page often precedes real-world
  # policy news. Small diffs and bot edits are filtered out in the fetcher.
  # Category is deliberately not "policy" — these go to #raw-feed only;
  # LLM hypothesis generation would be too noisy here.
  - id: wikipedia_policy_pages
    type: wikipedia
    endpoint: https://en.wikipedia.org/w/api.php
    query: "Federal_Reserve|Bank_of_Japan|European_Central_Bank|Bank_of_England|People%27s_Bank_of_China|Inflation|Quantitative_easing|Yield_curve_control|Federal_funds_rate|Monetary_policy|Fiscal_policy|Tariff|Sanctions|Interest_rate|Trade_war"
    category: policy_leading_indicator
    frequency: frequent

  # ─────────── GDELT (frequent) ───────────
  # GDELT 2.0 DOC 2.0 API. Query uses GDELT's search DSL:
  #   theme:<GKG_THEME>  filters by GDELT GKG themes (curated topic tags)
  #   sourcelang:eng     limits to English-language articles (noise control)
  # Broaden by adding themes or removing sourcelang; see docs at
  # https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/
  - id: gdelt_events
    type: gdelt
    endpoint: https://api.gdeltproject.org/api/v2/doc/doc
    query: (theme:ECON_INFLATION OR theme:ECON_INTERESTRATES OR theme:ECON_CENTRALBANK OR theme:ECON_STOCKMARKET OR theme:ECON_FISCAL) sourcelang:eng
    category: political_events
    frequency: frequent

  # ─────────── FRED (daily) ───────────
  # Individual series IDs live in metrics.yaml (source_id).
  - id: fred
    type: fred_api
    endpoint: https://api.stlouisfed.org/fred/series/observations
    category: macro_indicator
    frequency: daily

  # ─────────── yfinance (daily EOD) ───────────
  # Individual tickers live in metrics.yaml (source_id).
  - id: yfinance
    type: yfinance
    category: market_data
    frequency: daily

  # ─────────── CFTC COT (weekly, Fri 15:30 ET release) ───────────
  # Uses Socrata Open Data API for "Traders in Financial Futures" (TFF).
  # Field naming: lev_money_positions_long / lev_money_positions_short.
  # Docs: https://publicreporting.cftc.gov/api/views/gpe5-46if
  - id: cftc_cot_financial
    type: cot
    endpoint: https://publicreporting.cftc.gov/resource/gpe5-46if.json
    category: positioning
    frequency: weekly
