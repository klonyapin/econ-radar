name: ingest-daily

on:
  schedule:
    - cron: "30 22 * * *"    # 22:30 UTC ≈ 07:30 JST — after most Asia EOD prints
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_RAW: ${{ secrets.DISCORD_WEBHOOK_RAW }}
          DISCORD_WEBHOOK_MARKETS: ${{ secrets.DISCORD_WEBHOOK_MARKETS }}
          DISCORD_WEBHOOK_POLICY: ${{ secrets.DISCORD_WEBHOOK_POLICY }}
          DISCORD_WEBHOOK_MACRO: ${{ secrets.DISCORD_WEBHOOK_MACRO }}
          DISCORD_WEBHOOK_SURPRISE: ${{ secrets.DISCORD_WEBHOOK_SURPRISE }}
          DISCORD_WEBHOOK_RETRO: ${{ secrets.DISCORD_WEBHOOK_RETRO }}
        run: python -m src.main ingest-daily

      - name: Commit state
        run: |
          git config user.name "econ-radar[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "chore: update state (ingest-daily)"
          git pull --rebase --autostash
          git push
