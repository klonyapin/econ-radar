name: retrospective

on:
  schedule:
    - cron: "0 1 * * *"      # 01:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_RETRO: ${{ secrets.DISCORD_WEBHOOK_RETRO }}
        run: python -m src.main retrospective

      - name: Commit state
        run: |
          git config user.name "econ-radar[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "chore: update state (retrospective)"
          git pull --rebase --autostash
          git push
