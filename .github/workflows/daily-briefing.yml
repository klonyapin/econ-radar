name: daily-briefing

on:
  schedule:
    - cron: "45 22 * * *"    # 07:45 JST — morning note (ingest-daily runs at 22:30)
    - cron: "0 13 * * *"     # 22:00 JST — evening note (after Tokyo close, US open)
  workflow_dispatch:
    inputs:
      mode:
        description: "morning | evening"
        type: choice
        options: [morning, evening]
        default: morning

permissions:
  contents: write

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then
            echo "mode=evening" >> "$GITHUB_OUTPUT"
          else
            echo "mode=morning" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        env:
          JOB_MODE: ${{ steps.mode.outputs.mode }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_POLICY: ${{ secrets.DISCORD_WEBHOOK_POLICY }}
        run: python -m src.main daily-briefing

      - name: Commit state
        run: |
          git config user.name "econ-radar[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "chore: update state (daily-briefing ${{ steps.mode.outputs.mode }})"
          git pull --rebase --autostash
          git push
